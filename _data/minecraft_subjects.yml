# Minecraft render-subject registry for the Zalgo deployment.
#
# Source of truth. Edit here, then regenerate the marks with:
#   python3 tools/zalgoize.py
#
# Fields
#   id       slug, stable, also the anchor on the page
#   subject  human name of the render subject
#   edition  java | pocket
#   class    modeled | shadered | both   -> decides the direction of the zalgo mark
#   tier     1 | 2 | 3                   -> decides how dense the zalgo mark is
#            1 plain asset you can open and grep
#            2 engine-side config resolved at runtime
#            3 compiled or code-only, not inspectable from a pack
#   stack    which renderer/pipeline it belongs to
#   where    path or code location
#   tell     the thing you look for to identify it

subjects:
  # ---------------------------------------------------------------- Java Edition
  - id: je-block-model
    subject: Block model
    edition: java
    class: modeled
    tier: 1
    stack: Java resource pack
    where: assets/minecraft/models/block/*.json
    tell: >-
      An "elements" array of cuboids with "from"/"to" inside the 0-16 model box,
      or a bare "parent" pointing at block/cube_all.

  - id: je-item-model
    subject: Item model
    edition: java
    class: modeled
    tier: 1
    stack: Java resource pack
    where: assets/minecraft/models/item/*.json
    tell: >-
      A "display" block with thirdperson_righthand / gui transforms, usually on
      parent item/generated (flat, extruded from the sprite) or item/handheld.

  - id: je-blockstate
    subject: Blockstate definition
    edition: java
    class: modeled
    tier: 1
    stack: Java resource pack
    where: assets/minecraft/blockstates/*.json
    tell: >-
      "variants" or "multipart" mapping state strings to a model plus x/y
      rotation - the router, never geometry itself.

  - id: je-entity-model
    subject: Entity model
    edition: java
    class: modeled
    tier: 3
    stack: Java client code
    where: net.minecraft.client.model.* (LayerDefinition / ModelPart)
    tell: >-
      CubeListBuilder.addBox plus PartPose.offset in code - no JSON on disk, so
      it cannot be reshaped from a resource pack, only retextured.

  - id: je-baked-quad
    subject: Baked quad
    edition: java
    class: both
    tier: 3
    stack: Java model baking
    where: BakedModel#getQuads -> BakedQuad
    tell: >-
      The int[] vertex payload with packed position, UV, normal and tint index -
      where a JSON model stops being geometry and becomes buffer data.

  - id: je-block-entity-renderer
    subject: Block entity renderer
    edition: java
    class: both
    tier: 3
    stack: Java client code
    where: BlockEntityRenderer<T> implementations
    tell: >-
      Draws per frame through PoseStack + MultiBufferSource and picks its own
      RenderType - chests, signs, beds and banners live here, not in the mesh.

  - id: je-core-shader
    subject: Core shader program
    edition: java
    class: shadered
    tier: 1
    stack: Java core rendering
    where: assets/minecraft/shaders/core/rendertype_*.{json,vsh,fsh}
    tell: >-
      A JSON naming its "vertex"/"fragment" pair and declaring uniforms such as
      ModelViewMat, ProjMat, FogStart, ColorModulator.

  - id: je-post-chain
    subject: Post-processing chain
    edition: java
    class: shadered
    tier: 1
    stack: Java core rendering
    where: assets/minecraft/shaders/post/*.json + program/*.fsh
    tell: >-
      "targets" plus a "passes" list with auxtargets - the creeper, spider and
      invert screen effects are the built-in examples.

  - id: je-render-type
    subject: RenderType
    edition: java
    class: shadered
    tier: 2
    stack: Java core rendering
    where: RenderType.entityCutoutNoCull / .solid / .translucent
    tell: >-
      Names that mirror the core shader files (rendertype_entity_translucent);
      it bundles the shader with blend, depth, cull and layering state.

  - id: je-light-texture
    subject: Lightmap texture
    edition: java
    class: shadered
    tier: 2
    stack: Java core rendering
    where: LightTexture (16x16 NativeImage)
    tell: >-
      Sampled through the UV2 vertex attribute - sky light on one axis, block
      light on the other, so a "lighting bug" is often this and not a shader.

  - id: je-texture-atlas
    subject: Texture atlas / sprite source
    edition: java
    class: shadered
    tier: 1
    stack: Java resource pack
    where: assets/minecraft/atlases/*.json
    tell: >-
      "sources" entries of type directory / single / paletted_permutations that
      stitch sprites into textures/atlas/blocks.png.

  - id: je-shaderpack
    subject: Shader pack (Iris / OptiFine)
    edition: java
    class: shadered
    tier: 2
    stack: Java, third-party pipeline
    where: shaders/gbuffers_*.vsh, composite*.fsh, shadow.vsh, shaders.properties
    tell: >-
      The gbuffers_/deferred_/composite_ naming plus /* DRAWBUFFERS:0123 */
      comments - a deferred pipeline bolted over the vanilla one.

  # -------------------------------------------- Pocket Edition (Bedrock) --------
  - id: pe-geometry
    subject: Entity geometry
    edition: pocket
    class: modeled
    tier: 1
    stack: Bedrock resource pack
    where: models/entity/*.geo.json
    tell: >-
      format_version 1.12.0 with "minecraft:geometry" -> bones[] carrying pivot,
      cubes[] and per-face uv. This is the file Blockbench writes.

  - id: pe-block-geometry
    subject: Custom block geometry
    edition: pocket
    class: modeled
    tier: 1
    stack: Bedrock behaviour + resource pack
    where: blocks/*.json + models/blocks/*.geo.json
    tell: >-
      A "minecraft:geometry" component naming geometry.<id>, paired with
      "minecraft:material_instances" that binds each face to a render method.

  - id: pe-attachable
    subject: Attachable
    edition: pocket
    class: modeled
    tier: 1
    stack: Bedrock resource pack
    where: attachables/*.json
    tell: >-
      "minecraft:attachable" with item, geometry and render_controllers, gated
      on the Molang query query.is_first_person for the held/worn split.

  - id: pe-animation-controller
    subject: Animation controller / Molang rig
    edition: pocket
    class: modeled
    tier: 2
    stack: Bedrock resource pack
    where: animation_controllers/*.json + animations/*.animation.json
    tell: >-
      controller.animation.<name> states with Molang "transitions"; the animation
      keys bones by the exact names used in the .geo.json.

  - id: pe-client-entity
    subject: Client entity definition
    edition: pocket
    class: both
    tier: 1
    stack: Bedrock resource pack
    where: entity/*.entity.json
    tell: >-
      "minecraft:client_entity" whose description maps geometry, materials,
      textures, render_controllers and scripts.animate - the subject index itself.

  - id: pe-render-controller
    subject: Render controller
    edition: pocket
    class: both
    tier: 2
    stack: Bedrock resource pack
    where: render_controllers/*.json
    tell: >-
      controller.render.<name> choosing geometry, materials and textures arrays
      from Molang at runtime - why a mob can swap model and shader mid-frame.

  - id: pe-particle
    subject: Particle effect
    edition: pocket
    class: both
    tier: 1
    stack: Bedrock resource pack
    where: particles/*.json
    tell: >-
      "particle_effect" with components such as
      minecraft:particle_appearance_billboard - it names a material and sizes
      itself from Molang, so it is modelled and shaded in one file.

  - id: pe-material
    subject: RenderDragon material
    edition: pocket
    class: shadered
    tier: 3
    stack: Bedrock RenderDragon
    where: renderer/materials/*.material.bin
    tell: >-
      A compiled blob keyed by pass name (entity_alphatest, sky, blocks) holding
      per-platform HLSL/GLSL/MSL variants. Retail clients do not load overrides
      of these, which is why "Bedrock shaders" are really texture tricks.

  - id: pe-texture-set
    subject: PBR texture set
    edition: pocket
    class: shadered
    tier: 1
    stack: Bedrock RenderDragon (deferred)
    where: textures/**/*.texture_set.json
    tell: >-
      "minecraft:texture_set" with color plus metalness_emissive_roughness
      (the _mer map) and normal or heightmap - the only shading channel a pack
      can actually author.

  - id: pe-deferred-lighting
    subject: Deferred lighting settings
    edition: pocket
    class: shadered
    tier: 2
    stack: Bedrock RenderDragon (deferred)
    where: lighting/global.json, pbr/global.json, atmospherics/*.json
    tell: >-
      minecraft:lighting_settings / minecraft:atmosphere_settings - sun, moon,
      ambient and emissive response for the deferred (Vibrant Visuals / RTX) path.

  - id: pe-fog
    subject: Fog settings
    edition: pocket
    class: shadered
    tier: 1
    stack: Bedrock resource pack
    where: fogs/*.json
    tell: >-
      "minecraft:fog_settings" with distance and volumetric blocks per camera
      location (air, water, weather, lava) - the cheapest visible shading hook.
